# golangci-lint configuration for goboxd
# Go 1.22+ systems project with security focus

run:
  timeout: 5m
  go: '1.22'
  build-tags:
    - ""

# Define which linters to enable/disable
linters:
  enable:
    # Enabled linters
    - asasalint        # Find misuse of sync/atomic
    - bidichk          # Check for dangerous unicode bidirectional characters
    - bodyclose        # Ensures HTTP response bodies are closed
    - decorder         # Checks declaration order
    - dogsled          # Prevents blank identifier assignments
    - dupword          # Finds duplicate words in comments
    - errcheck         # Unchecked error returns
    - errorlint        # Identifies improper error wrapping
    - gocritic         # Opinionated Go code style checks
    - gofmt            # Enforce gofmt formatting
    - govet            # Official Go vet
    - ineffassign      # Ineffectual assignments
    - loggercheck      # Incorrect logging calls
    - misspell         # Spelling errors in comments and identifiers
    - prealloc         # Preallocate slices when possible
    - staticcheck      # Advanced static analysis
    - tenv             # t.Setenv() instead of os.Setenv()
    - typecheck        # Type checking
    - unconvert        # Unnecessary type conversions
    - unused           # Unused code detection
    - whitespace       # Whitespace issues
    - gosimple         # Simplify code

  disable:
    # Disabled to reduce false positives for systems project
    - wrapcheck        # Too strict for internal error handling
    - exhaustive       # Not needed for this use case
    - sqlc             # No SQL in this project
    - cyclop           # Cyclomatic complexity (reasonable for systems code)
    - dupl             # Duplicate code (acceptable at module boundaries)
    - forbidigo        # Allow print/fmt usage in specific contexts
    - gocognit         # Cognitive complexity (systems code unavoidably complex)
    - gocyclo          # Cyclomatic complexity (systems code can exceed limits)
    - gomoddirectives  # Not needed
    - lll              # Line length (we use editor wrapping)
    - mnd              # Magic numbers (legitimate in systems code)
    - varnamelen       # Variable name length (ok for single-use iterators)
    - weirdlinter      # No specific needs

# Per-linter configuration
linters-settings:
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
      - experimental
    disabled-checks:
      - commentedOutCode    # Legitimate for reference code
      - hugeParam           # OK for nsjail config structs

  errcheck:
    check-type-assertions: true
    check-blank: true
    exclude-functions:
      - io.Copy          # Acceptable data loss in some contexts
      - fmt.Fprint       # Logging failures are non-critical

  staticcheck:
    # Use all checks
    checks: ["all"]

  gosimple:
    checks: ["all"]

  unused:
    check-exported: false  # Allow exported but unused (public API)

  govet:
    enable:
      - all
    disable:
      - shadow           # Allow shadowing for clarity in some cases

issues:
  exclude-rules:
    # Allow blank identifier in for loops
    - source: "var _ ="
    - linters:
        - unparam
      source: "^_"

  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
