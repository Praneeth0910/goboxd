name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Prefer auto model resolution
        run: |
          echo "COPILOT_AGENT_MODEL=auto" >> "$GITHUB_ENV"
          echo "COPILOT_MODEL=auto" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Pre-download Go modules
        run: go mod download
