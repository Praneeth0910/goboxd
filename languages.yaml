# Adding a new language is simple:
# 1. Add one YAML block under languages
# 2. Add one install line in Dockerfile
# 3. Zero Go code changes needed

languages:
  py3:
    id: py3
    name: Python 3
    source_filename: solution.py
    run:
      cmd: /usr/bin/python3
      args:
        - "{{source}}"
      limits:
        wall_time_s: 9
        memory_kb: 102400
        max_processes: 100

  cpp:
    id: cpp
    name: C++
    source_filename: solution.cpp
    artifact: solution
    build:
      cmd: /usr/bin/g++
      args:
        - "{{flags}}"
        - "-o"
        - "{{artifact}}"
        - "{{source}}"
      limits:
        wall_time_s: 3
        memory_kb: 1048576
        max_processes: 100
      flag_allowlist:
        - "-O0"
        - "-O1"
        - "-O2"
        - "-O3"
        - "-Wall"
        - "-Wextra"
        - "-std=*"
    run:
      cmd: ./{{artifact}}
      limits:
        wall_time_s: 3
        memory_kb: 524288
        max_processes: 64

max_source_bytes: 262144
max_tests: 50
max_concurrent: 0
