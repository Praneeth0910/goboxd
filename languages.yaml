# Adding a new language is simple:
# 1. Add one YAML block under languages
# 2. Add one install line in Dockerfile
# 3. Zero Go code changes needed

languages:
  py3:
    id: py3
    name: Python 3
    source_filename: solution.py
    run:
      cmd: /usr/bin/python3
      args:
        - "{{source}}"
      limits:
        wall_time_s: 9
        memory_kb: 102400
        max_processes: 100

  cpp:
    id: cpp
    name: C++
    source_filename: solution.cpp
    artifact: solution
    build:
      cmd: /usr/bin/g++
      args:
        - "{{flags}}"
        - "-o"
        - "{{artifact}}"
        - "{{source}}"
      limits:
        wall_time_s: 10
        memory_kb: 1048576
        max_processes: 100
      flag_allowlist:
        - "-O0"
        - "-O1"
        - "-O2"
        - "-O3"
        - "-Wall"
        - "-Wextra"
        - "-std=*"
    run:
      cmd: ./{{artifact}}
      limits:
        wall_time_s: 3
        memory_kb: 524288
        max_processes: 64

  c:
    id: c
    name: C
    source_filename: solution.c
    artifact: solution
    build:
      cmd: /usr/bin/gcc
      args:
        - "{{flags}}"
        - "-o"
        - "{{artifact}}"
        - "{{source}}"
      limits:
        wall_time_s: 10
        memory_kb: 1048576
        max_processes: 100
      flag_allowlist:
        - "-O0"
        - "-O1"
        - "-O2"
        - "-O3"
        - "-Wall"
        - "-Wextra"
        - "-std=*"
    run:
      cmd: ./{{artifact}}
      limits:
        wall_time_s: 3
        memory_kb: 524288
        max_processes: 64

  java:
    id: java
    name: Java
    source_filename: Solution.java
    source_filename_strategy: from_request
    artifact: Solution.class
    artifact_filename_strategy: from_request
    build:
      cmd: /usr/bin/javac
      args:
        - "{{source}}"
      limits:
        wall_time_s: 5
        memory_kb: 1048576
        max_processes: 100
    run:
      cmd: /usr/bin/java
      args:
        - "{{class}}"
      limits:
        wall_time_s: 5
        memory_kb: 524288
        max_processes: 100

  node:
    id: node
    name: Node.js (javascript)
    source_filename: solution.js
    run:
      cmd: /usr/bin/node
      args:
        - "{{source}}"
      limits:
        wall_time_s: 9
        memory_kb: 102400
        max_processes: 100

  bash:
    id: bash
    name: Bash (sh)
    source_filename: solution.sh
    run:
      cmd: /bin/bash
      args:
        - "{{source}}"
      limits:
        wall_time_s: 9
        memory_kb: 102400
        max_processes: 100

  verilog:
    id: verilog
    name: Verilog
    source_filename: solution.v
    artifact: solution.vvp
    build:
      cmd: /usr/bin/iverilog
      args:
        - "-o"
        - "{{artifact}}"
        - "{{source}}"
      limits:
        wall_time_s: 5
        memory_kb: 524288
        max_processes: 100
    run:
      cmd: /usr/bin/vvp
      args:
        - "{{artifact}}"
      limits:
        wall_time_s: 5
        memory_kb: 262144
        max_processes: 100

  rust:
    id: rust
    name: Rust
    source_filename: solution.rs
    artifact: solution
    build:
      cmd: /usr/bin/rustc
      args:
        - "-O"
        - "-o"
        - "{{artifact}}"
        - "{{source}}"
      limits:
        wall_time_s: 10
        memory_kb: 1048576
        max_processes: 100
    run:
      cmd: ./{{artifact}}
      limits:
        wall_time_s: 3
        memory_kb: 524288
        max_processes: 64

  go:
    id: go
    name: Go
    source_filename: solution.go
    artifact: solution
    build:
      cmd: /usr/local/go/bin/go
      args:
        - "build"
        - "-o"
        - "{{artifact}}"
        - "{{source}}"
      limits:
        wall_time_s: 15
        memory_kb: 1048576
        max_processes: 100
    run:
      cmd: ./{{artifact}}
      limits:
        wall_time_s: 3
        memory_kb: 524288
        max_processes: 64

  kotlin:
    id: kotlin
    name: Kotlin
    source_filename: solution.kt
    artifact: solution.jar
    build:
      cmd: /usr/bin/kotlinc
      args:
        - "{{source}}"
        - "-include-runtime"
        - "-d"
        - "{{artifact}}"
      limits:
        wall_time_s: 15
        memory_kb: 1048576
        max_processes: 100
    run:
      cmd: /usr/bin/java
      args:
        - "-jar"
        - "{{artifact}}"
      limits:
        wall_time_s: 5
        memory_kb: 524288
        max_processes: 100
  ruby:
    id: ruby
    name: Ruby
    source_filename: solution.rb
    run:
      cmd: /usr/bin/ruby
      args:
        - "{{source}}"
      limits:
        wall_time_s: 9
        memory_kb: 102400
        max_processes: 100
max_source_bytes: 262144
max_tests: 50
max_concurrent: 0
queue_timeout_s: 30
