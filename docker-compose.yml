services:
  goboxd:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goboxd
    ports:
      - "8080:8080"
    volumes:
      - ./languages.yaml:/etc/goboxd/languages.yaml:ro
    environment:
      - GOBOXD_MAX_CONCURRENT=
      - NSJAIL_PATH=/usr/sbin/nsjail
      - LANGUAGES_CONFIG=/etc/goboxd/languages.yaml
    privileged: true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s